:"new-api-arm64-v1.0.0-rc.52","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":138936585,"digest":"sha256:8f7627948a7cc6d4aa471d1020ca811f85d435c657561e468b96c5ae702a06fd","download_count":37,"created_at":"2026-11-27T17:37:26Z","updated_at":"2026-11-27T17:37:31Z"},{"id":801429744,"node_id":"RA_kwDOKr-Pws4vxNjw","name":"new-api-macos-v1.0.0-rc.52","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":169183570,"digest":"sha256:716385df34c9f72bec23ef6c50ed15de16f953f3a0eb515e1543684ffd94d285","download_count":27,"created_at":"2026-11-27T17:36:25Z","updated_at":"2026-11-27T17:36:34Z"},{"id":801433173,"node_id":"RA_kwDOKr-Pws4vxOZV","name":"new-api-v1.0.0-rc.52","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":143733001,"digest":"sha256:3a9304ab86dae125fe2d55671b688464bd1fdd29dac4af295321f3ec6b687f9e","download_count":178,"created_at":"2026-11-27T17:37:26Z","updated_at":"2026-11-27T17:37:31Z"},{"id":801437864,"node_id":"RA_kwDOKr-Pws4vxPio","name":"new-api-v1.0.0-rc.52.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":145709568,"digest":"sha256:9971be7b60c1bdbc829106be0a33a1da2096b8bceb21489841c4fc8b07724559","download_count":239,"created_at":"2026-11-27T17:39:08Z","updated_at":"2026-11-27T17:39:13Z"},{"id":801433172,"node_id":"RA_kwDOKr-Pws4vxOZU","name":"THIRD-PARTY-LICENSES.md","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/markdown","state":"uploaded","size":54139,"digest":"sha256:7c653bfa672402ad1600d233ed3236f10f5e63cffdf954b65ab88dbc4c30d408","download_count":5,"created_at":"2026-11-27T17:37:26Z","updated_at":"2026-11-27T17:37:27Z"}],"body":"## 中文\n\n* **插件**：请求处理插件可以声明适用的模型和渠道类型，管理员确认一次后自动覆盖新增的渠道和模型（#8335、#8341）。提供商插件的路由可以按渠道单独开关（#8482）。插件市场支持一键更新全部已安装插件（#8413）。放宽了插件响应和 JSON 克隆的大小限制。\n* **模型广场**：新增「推荐」「请求最多」「Token 最多」排序，默认按推荐；模型管理里可设置手动顺序或按近 1/7/30 天用量排序。\n* **转发**：高级自定义渠道和提供商插件可以把 `/v1/responses` 转成 Anthropic Messages（#8465）。Claude 工具的 `input_schema` 顶层有 oneOf/anyOf/allOf 时自动展平，Codex Desktop 转 Claude 不再 400（#8476）。所有分组都没有配置的模型返回 404 `model_not_found`，不再返回 503 让 SDK 重试（#8480）。请求内容引起的本地错误不再重试其他渠道，也不再自动禁用渠道（#8345）。\n* **计费**：Gemini 音频 inlineData 在缺少 usage 时按时长计费，不再按图片计（#8193）。Claude 的 `thinking_tokens` 记为推理 token（#8431）。缓存计费在编辑器、定价页和日志里统一显示为 GPT 30 分钟/12 小时、Claude 5 分钟/1 小时等类别。\n* **模型与任务**：新增 doubao-seedream-5-5（#8324）、海螺 MiniMax-H3-Max（#8453），可灵 kling-4.0 支持 4:3 和 3:4（#8348）。Gemini 4 的思考等级按模型映射（#8367、#8412）。修复了私有渠道的任务媒体下载（#8199）、进度 100% 但未结束的任务停止轮询（#8201）和图片任务插件参数覆盖（#8027）。\n* **其他**：批量设置渠道标签后渠道能力立即按新标签重建。插件 API v1 拆为独立模块 `pluginkit`，其他程序可以直接引用（#8475）。\n\n## English\n\n* **Plugins**: Request processing plugins can declare the models and channel types they are made for; after an administrator confirms once, they cover new channels and models automatically (#8335, #8341). Provider plugin routes can be switched on or off per channel (#8482). The plugin marketplace can update every installed plugin at once (#8413). Plugin response and JSON clone size limits are higher.\n* **Model square**: New Recommended, Most requests and Most tokens sorts, with Recommended as the default; model management can set a manual order or sort by usage over the last 1, 7 or 30 days.\n* **Relay**: Advanced Custom channels and provider plugins can route `/v1/responses` to Anthropic Messages (#8465). Claude tool `input_schema` with a top-level oneOf/anyOf/allOf is flattened, so Codex Desktop through Claude no longer gets a 400 (#8476). A model configured in none of the eligible groups returns 404 `model_not_found` instead of a 503 that SDKs retry (#8480). Local errors caused by the request are no longer retried on other channels and no longer disable channels (#8345).\n* **Billing**: Gemini audio inlineData is billed by length, not as images, when usage is missing (#8193). Claude `thinking_tokens` count as reasoning tokens (#8431). Cache pricing shows the same categories (GPT 30m/12h, Claude 5m/1h and others) in the editor, pricing pages and logs.\n* **Models and tasks**: Added doubao-seedream-5-5 (#8324) and Hailuo MiniMax-H3-Max (#8453); Kling kling-4.0 supports 4:3 and 3:4 (#8348). Gemini 4 thinking levels are mapped per model (#8367, #8412). Fixed task media downloads on private channels (#8199), polling stopping for unfinished tasks at 100% progress (#8201) and image task plugin parameter overrides (#8027).\n* **Also**: Batch tag changes rebuild channel abilities with the new tags right away. Plugin API v1 is now the standalone `pluginkit` module that other programs can import (#8475).\n\n---\n\n## What's Changed\n* feat(plugins): add doubao seedream 5.5 by @feitianbubu in https://github.com/QuantumNous/new-api/pull/8324\n* feat(plugins): 请求处理插件可声明作用范围，管理员确认一次即自动覆盖 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8335\n* fix(plugins): 请求处理插件的两个作用范围分别匹配请求 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8341\n* docs(github): slim agent issue and PR templates by @seefs001 in https://github.com/QuantumNous/new-api/pull/8344\n* fix(relay): 请求内容引起的本地错误不再重试和禁用渠道 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8345\n* docs(github): let core maintainers skip agent issue and PR templates by @seefs001 in https://github.com/QuantumNous/new-api/pull/8352\n* fix(relaykit): join Gemini text parts verbatim in chat responses by @xzdmycbx in https://github.com/QuantumNous/new-api/pull/8136\n* fix(relaykit): map Gemini 4 thinking levels per model by @seefs001 in https://github.com/QuantumNous/new-api/pull/8367\n* fix(relay): apply GPT-6 chat parameter rules to gpt-6.2-astra and gpt-6.2-sol by @feitianbubu in https://github.com/QuantumNous/new-api/pull/8375\n* fix: 修复图片任务插件参数覆盖并补充百炼回归测试 by @bddiudiu in https://github.com/QuantumNous/new-api/pull/8027\n* fix(task): 持续轮询进度为 100% 的非终态任务 by @SkyKoo in https://github.com/QuantumNous/new-api/pull/8201\n* fix(task): build text-only multipart requests from JSON by @SkyKoo in https://github.com/QuantumNous/new-api/pull/8198\n* fix(task): 修复私有渠道的任务媒体下载 by @SkyKoo in https://github.com/QuantumNous/new-api/pull/8199\n* fix(relaykit): match Gemini 4 thinking levels by family prefix by @seefs001 in https://github.com/QuantumNous/new-api/pull/8412\n* feat(kling): map sizes to the 4:3 and 3:4 aspect ratios of kling-4.0 by @feitianbubu in https://github.com/QuantumNous/new-api/pull/8348\n* fix(deepseek): report supported endpoint metadata by @uouuou in https://github.com/QuantumNous/new-api/pull/8296\n* fix(relaykit): report cached tokens in Gemini usageMetadata built from chat usage by @feeeei in https://github.com/QuantumNous/new-api/pull/8333\n* chore(deps): bump go.opentelemetry.io/otel/trace from 1.41.0 to 1.47.0 by @dependabot[bot] in https://github.com/QuantumNous/new-api/pull/8326\n* fix(models): 打开排序弹窗时再读取系统选项 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8454\n* fix(groups): 匿名请求公开分组接口时跳过用户分组查询 by @oldnicke in https://github.com/QuantumNous/new-api/pull/8463\n* fix(claude): map output_tokens_details.thinking_tokens to reasoning_tokens by @forgottener in https://github.com/QuantumNous/new-api/pull/8431\n* fix(gemini): bill audio inlineData by length, not as images, when usage is missing by @videogen-art in https://github.com/QuantumNous/new-api/pull/8193\n* fix(relay): remove trailing newline from ClaudeChunkData data frame by @seefs001 in https://github.com/QuantumNous/new-api/pull/8474\n* refactor(plugins): 把插件 API v1 拆成独立模块 pluginkit by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8475\n* fix(relaykit): Claude input_schema 顶层 oneOf/anyOf/allOf 展平为单一对象 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8476\n* fix(pluginkit): 单独构建时使用仓库内的 relaykit by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8477\n* feat(hailuo): support MiniMax-H3-Max with its own durations, resolutions and usage profile by @feitianbubu in https://github.com/QuantumNous/new-api/pull/8453\n* feat(relay): allow openai_responses_to_claude_messages in Advanced Custom and plugin relay routes by @zwenooo in https://github.com/QuantumNous/new-api/pull/8465\n* feat(plugin): 提供商插件的路由可按渠道配置开关（enabled_by） by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8478\n* Revert \"feat(plugin): 提供商插件的路由可按渠道配置开关（enabled_by）\" by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8479\n* fix(relay): return 404 for models missing from all eligible groups by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8480\n* feat(plugin): 插件渠道可按渠道开关提供商插件的路由 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8482\n\n## New Contributors\n* @xzdmycbx made their first contribution in https://github.com/QuantumNous/new-api/pull/8136\n* @SkyKoo made their first contribution in https://github.com/QuantumNous/new-api/pull/8201\n* @uouuou made their first contribution in https://github.com/QuantumNous/new-api/pull/8296\n* @feeeei made their first contribution in https://github.com/QuantumNous/new-api/pull/8333\n* @oldnicke made their first contribution in https://github.com/QuantumNous/new-api/pull/8463\n* @forgottener made their first contribution in https://github.com/QuantumNous/new-api/pull/8431\n* @videogen-art made their first contribution in https://github.com/QuantumNous/new-api/pull/8193\n* @zwenooo made their first contribution in https://github.com/QuantumNous/new-api/pull/8465\n\n**Full Changelog**: https://github.com/QuantumNous/new-api/compare/v1.0.0-rc.51...v1.0.0-rc.52\n","mentions_count":13}
